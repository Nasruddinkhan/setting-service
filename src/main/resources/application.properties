# ===================================================================
# Core Application Metadata & Routing
# ===================================================================
spring.application.name=@artifactId@
spring.profiles.active=${active.profile:local}
server.servlet.context-path=/${spring.application.name}
server.port=8080
api.context.path=/api/v1

# ===================================================================
# Redis Cache Configuration
# ===================================================================
spring.cache.redis.cache-null-values=false
cache.configuration.default-ttl=86400
cache.configuration.market-prefix=maak-${spring.application.name}

# ===================================================================
# Actuator, Metrics & Monitoring (Prometheus)
# ===================================================================
management.tracing.enabled=false
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.metrics.tags.instance=${spring.profiles.active}
management.metrics.tags.application=${spring.application.name}
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===================================================================
# Database Connection Pool (HikariCP - Oracle)
# ===================================================================
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000


